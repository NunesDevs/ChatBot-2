name: ChatBot-2 quality

on:
  push:
    branches: [main, codex/quality-refresh]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatbot-2-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Verified base Python dependencies
        run: python -m pip install --only-binary=:all: --require-hashes -r requirements.lock
      - name: Python API, data and preparation regressions
        run: python -m unittest discover -s tests -v
      - name: Install pinned browser test tooling
        run: |
          npm install --global pnpm@11.25.0 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec playwright install --with-deps chromium
      - name: Browser controller regressions
        run: pnpm test
      - name: Real HTTP flows and eight responsive widths
        env:
          PYTHON_EXECUTABLE: python
        run: pnpm test:e2e
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatbot-2-web-evidence
          path: reports/qa
          if-no-files-found: ignore
          retention-days: 7
